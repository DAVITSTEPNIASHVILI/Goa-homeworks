{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "index.css" %}">
</head>
<body>
    <h1>All post</h1>

    {% for post in all_post %}
        <div>
            <h2>Username: {{ post.user }}</h2>
            <p>Description: {{ post.description }}</p>
            <a href="{% url "delete_post" post.id %}"><button id='btn2'>Delete</button></a>
        </div>
    {% endfor %}

    <a href="{% url "add_post" %}"><button id='btn1'>Add</button></a>
</body>
</html>
